<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>09 个人中心 · 城市记忆盲盒线框</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e9e9;color:#111;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:34px 16px 60px;min-height:100vh}
.page-tag{font-size:13px;color:#888;letter-spacing:2px;margin-bottom:14px}
.page-tag b{color:#111;font-size:15px}
.phone{width:390px;max-width:100%;background:#fff;border:2px solid #111;border-radius:28px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 12px 32px rgba(0,0,0,.10)}
.topbar{display:flex;align-items:center;gap:12px}
.back{width:34px;height:34px;flex:0 0 34px;border:1.5px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.title{font-size:17px;font-weight:700}
.spacer{flex:1}
.chip{border:1.5px solid #111;border-radius:999px;font-size:12px;padding:5px 12px;color:#111}
.chip.ghost{border-color:#9c9c9c;color:#777}
.box{border:1.5px solid #111;border-radius:14px}
.bar{height:10px;border-radius:5px;background:#dcdcdc}
.bar.d{background:#9c9c9c}
.btn{border:1.5px solid #111;border-radius:999px;padding:13px 0;text-align:center;font-size:15px;font-weight:600;background:#fff;color:#111}
.btn.ghost{border-color:#9c9c9c;color:#666;font-weight:400}
.ic{width:26px;height:26px;border:1.5px solid #111;border-radius:50%;flex:0 0 auto}
.pager{margin-top:18px;display:flex;gap:20px;font-size:13px}
.pager a{color:#555;text-decoration:none;border-bottom:1px solid #aaa;padding-bottom:2px}
.tabbar{display:flex;border:1.5px solid #111;border-radius:999px;padding:9px 8px;margin-top:auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#888}
.tab .ic{width:20px;height:20px}
.tab.active{color:#111;font-weight:700}
.tab.active .ic{background:#111}
.stat{flex:1;border:1.5px solid #111;border-radius:12px;padding:13px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.stat b{font-size:19px}
.stat span{font-size:11.5px;color:#888}
.menurow{border:1.5px solid #111;border-radius:12px;padding:14px 16px;display:flex;align-items:center;font-size:14px}
.menurow .chev{margin-left:auto;color:#aaa;font-size:18px}
</style>
</head>
<body>
<div class="page-tag"><b>09</b>&nbsp;个人中心 · profile.html</div>
<div class="phone">
  <div class="topbar"><div class="back">←</div><div class="title">个人中心</div></div>

  <div class="box" style="padding:18px 16px;display:flex;align-items:center;gap:14px">
    <div class="ic" style="width:56px;height:56px"></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <div class="bar d" style="width:96px;height:10px"></div>
      <div class="bar" style="width:64px;height:8px"></div>
    </div>
    <span class="chip ghost">编辑资料</span>
  </div>

  <div style="display:flex;gap:10px">
    <div class="stat"><b>2</b><span>收藏物件</span></div>
    <div class="stat"><b>12</b><span>浏览记录</span></div>
    <div class="stat"><b>2</b><span>探索城市</span></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="menurow">修改密码<span class="chev">›</span></div>
    <div class="menurow">我的城市<span class="chev">›</span></div>
    <div class="menurow">清除缓存<span class="chev">›</span></div>
    <div class="menurow">关于项目<span class="chev">›</span></div>
  </div>

  <div class="btn ghost">退出登录</div>

  <div class="tabbar">
    <div class="tab"><div class="ic"></div>首页</div>
    <div class="tab"><div class="ic"></div>图鉴</div>
    <div class="tab"><div class="ic"></div>记录</div>
    <div class="tab active"><div class="ic"></div>我的</div>
  </div>
</div>
<nav class="pager"><a href="08-card.html">‹ 上一页</a><a href="index.html">返回总览</a></nav>
</body>
</html>
