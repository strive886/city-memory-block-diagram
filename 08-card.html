<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 纪念卡分享页 · 城市记忆盲盒线框</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e9e9;color:#111;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:34px 16px 60px;min-height:100vh}
.page-tag{font-size:13px;color:#888;letter-spacing:2px;margin-bottom:14px}
.page-tag b{color:#111;font-size:15px}
.phone{width:390px;max-width:100%;background:#fff;border:2px solid #111;border-radius:28px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 12px 32px rgba(0,0,0,.10)}
.topbar{display:flex;align-items:center;gap:12px}
.back{width:34px;height:34px;flex:0 0 34px;border:1.5px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.title{font-size:17px;font-weight:700}
.spacer{flex:1}
.chip{border:1.5px solid #111;border-radius:999px;font-size:12px;padding:5px 12px;color:#111}
.chip.ghost{border-color:#9c9c9c;color:#777}
.ph{border:1.5px dashed #9c9c9c;border-radius:12px;background:#fafafa;display:flex;align-items:center;justify-content:center;color:#8f8f8f;font-size:12px;position:relative;overflow:hidden;text-align:center}
.ph::before,.ph::after{content:"";position:absolute;inset:0}
.ph::before{background:linear-gradient(to top right,transparent calc(50% - .6px),#d6d6d6 calc(50% - .6px),#d6d6d6 calc(50% + .6px),transparent calc(50% + .6px))}
.ph::after{background:linear-gradient(to top left,transparent calc(50% - .6px),#d6d6d6 calc(50% - .6px),#d6d6d6 calc(50% + .6px),transparent calc(50% + .6px))}
.ph span{position:relative;z-index:1;padding:6px 10px}
.bar{height:10px;border-radius:5px;background:#dcdcdc}
.bar.d{background:#9c9c9c}
.btn{border:1.5px solid #111;border-radius:999px;padding:13px 0;text-align:center;font-size:15px;font-weight:600;background:#fff;color:#111}
.btn.solid{background:#111;color:#fff}
.ic{width:26px;height:26px;border:1.5px solid #111;border-radius:50%;flex:0 0 auto}
.ic.sm{width:20px;height:20px}
.divider{display:flex;align-items:center;gap:10px;color:#999;font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#ccc}
.pager{margin-top:18px;display:flex;gap:20px;font-size:13px}
.pager a{color:#555;text-decoration:none;border-bottom:1px solid #aaa;padding-bottom:2px}
.mcard{border:2px solid #111;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.share{display:flex;justify-content:space-around;margin-top:2px}
.sitem{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:#555}
.sitem .ic{width:44px;height:44px}
</style>
</head>
<body>
<div class="page-tag"><b>08</b>&nbsp;纪念卡分享页 · card.html</div>
<div class="phone">
  <div class="topbar"><div class="back">←</div><div class="title">数字纪念卡</div><div class="spacer"></div><span class="chip ghost">Canvas 生成</span></div>

  <div class="mcard">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="ic sm"></div>
      <span style="font-size:12px;letter-spacing:2px;font-weight:600">城市记忆盲盒</span>
      <div class="spacer"></div><span style="font-size:10px;color:#bbb">NO.001</span>
    </div>
    <div class="ph" style="height:150px"><span>老物件图 · 旧车票</span></div>
    <div class="bar"></div>
    <div class="bar" style="width:88%"></div>
    <div class="bar" style="width:60%"></div>
    <div style="display:flex;justify-content:center;gap:20px;opacity:.85">
      <svg viewBox="0 0 48 48" width="20" height="20" fill="none" stroke="#111" stroke-width="2.4"><rect x="12" y="18" width="24" height="19" rx="8"/><path d="M18.5 18v6M24 18v6M29.5 18v6"/></svg>
      <svg viewBox="0 0 48 48" width="20" height="20" fill="none" stroke="#111" stroke-width="2.4"><circle cx="20" cy="29" r="4.5"/><circle cx="30" cy="20" r="4.5"/></svg>
      <svg viewBox="0 0 48 48" width="20" height="20" fill="none" stroke="#111" stroke-width="2.4"><circle cx="9" cy="24" r="4.5"/><circle cx="39" cy="24" r="4.5"/><path d="M15 24h18"/><path d="M19 20l-4 4 4 4M29 20l4 4-4 4"/></svg>
    </div>
    <div style="display:flex;align-items:center;gap:10px;border-top:1px dashed #ccc;padding-top:10px">
      <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="#111" stroke-width="2">
        <rect x="3" y="3" width="16" height="16"/><rect x="7" y="7" width="8" height="8" fill="#111" stroke="none"/>
        <rect x="29" y="3" width="16" height="16"/><rect x="33" y="7" width="8" height="8" fill="#111" stroke="none"/>
        <rect x="3" y="29" width="16" height="16"/><rect x="7" y="33" width="8" height="8" fill="#111" stroke="none"/>
        <path d="M29 29h6M39 29h6M29 35h4M37 35h8M29 41h10M43 39v6M35 43h4"/>
      </svg>
      <div style="flex:1;display:flex;flex-direction:column;gap:7px">
        <div class="bar d" style="width:52%;height:9px"></div>
        <div class="bar" style="width:38%;height:7px"></div>
      </div>
    </div>
  </div>

  <div style="display:flex;gap:10px">
    <div class="btn solid" style="flex:1">保存到相册</div>
    <div class="btn" style="flex:1">分享朋友圈</div>
  </div>

  <div class="divider">分享给好友 · 接力抓取</div>
  <div class="share">
    <div class="sitem"><div class="ic"></div>微信好友</div>
    <div class="sitem"><div class="ic"></div>朋友圈</div>
    <div class="sitem"><div class="ic"></div>复制链接</div>
  </div>
</div>
<nav class="pager"><a href="07-history.html">‹ 上一页</a><a href="index.html">总览</a><a href="09-profile.html">下一页：个人中心 ›</a></nav>
</body>
</html>
