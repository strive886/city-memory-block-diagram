<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06 图鉴页 · 城市记忆盲盒线框</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e9e9;color:#111;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:34px 16px 60px;min-height:100vh}
.page-tag{font-size:13px;color:#888;letter-spacing:2px;margin-bottom:14px}
.page-tag b{color:#111;font-size:15px}
.phone{width:390px;max-width:100%;background:#fff;border:2px solid #111;border-radius:28px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 12px 32px rgba(0,0,0,.10)}
.topbar{display:flex;align-items:center;gap:12px}
.back{width:34px;height:34px;flex:0 0 34px;border:1.5px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.title{font-size:17px;font-weight:700}
.spacer{flex:1}
.chip{border:1.5px solid #111;border-radius:999px;font-size:12px;padding:5px 12px;color:#111}
.chip.ghost{border-color:#9c9c9c;color:#777}
.box{border:1.5px solid #111;border-radius:14px}
.bar{height:10px;border-radius:5px;background:#dcdcdc}
.bar.d{background:#9c9c9c}
.ic{width:26px;height:26px;border:1.5px solid #111;border-radius:50%;flex:0 0 auto}
.pager{margin-top:18px;display:flex;gap:20px;font-size:13px}
.pager a{color:#555;text-decoration:none;border-bottom:1px solid #aaa;padding-bottom:2px}
.tabbar{display:flex;border:1.5px solid #111;border-radius:999px;padding:9px 8px;margin-top:auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#888}
.tab .ic{width:20px;height:20px}
.tab.active{color:#111;font-weight:700}
.tab.active .ic{background:#111}
.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{border:1.5px solid #111;border-radius:12px;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px}
.slot .thumb{width:100%;height:50px;border:1.5px dashed #b9b9b9;border-radius:8px}
.slot .nm{width:82%;height:7px;border-radius:4px;background:#c9c9c9}
.slot.locked{border-style:dashed;border-color:#bdbdbd}
.slot .qm{font-size:19px;color:#c4c4c4;font-weight:700;line-height:50px}
.track{flex:1;height:8px;border:1px solid #888;border-radius:5px;overflow:hidden}
.fill{height:100%;background:#111}
</style>
</head>
<body>
<div class="page-tag"><b>06</b>&nbsp;图鉴页 · collection.html</div>
<div class="phone">
  <div class="topbar"><div class="back">←</div><div class="title">我的图鉴</div><div class="spacer"></div><span class="chip">石家庄 ▾</span></div>

  <div class="box" style="padding:15px 16px;display:flex;align-items:center;gap:12px">
    <span style="font-size:13px;font-weight:600;white-space:nowrap">已收集 2 / 8</span>
    <div class="track"><div class="fill" style="width:25%"></div></div>
  </div>

  <div style="display:flex;gap:8px">
    <span class="chip">石家庄</span>
    <span class="chip ghost">正定</span>
  </div>

  <div class="grid8">
    <div class="slot"><div class="thumb"></div><div class="nm"></div></div>
    <div class="slot"><div class="thumb"></div><div class="nm"></div></div>
    <div class="slot locked"><div class="qm">?</div><div class="nm" style="background:#e3e3e3"></div></div>
    <div class="slot locked"><div class="qm">?</div><div class="nm" style="background:#e3e3e3"></div></div>
    <div class="slot locked"><div class="qm">?</div><div class="nm" style="background:#e3e3e3"></div></div>
    <div class="slot locked"><div class="qm">?</div><div class="nm" style="background:#e3e3e3"></div></div>
    <div class="slot locked"><div class="qm">?</div><div class="nm" style="background:#e3e3e3"></div></div>
    <div class="slot locked"><div class="qm">?</div><div class="nm" style="background:#e3e3e3"></div></div>
  </div>

  <div class="box" style="border-style:dashed;display:flex;align-items:center;gap:14px;padding:14px 16px">
    <svg viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="#111" stroke-width="2.5"><rect x="12" y="21" width="24" height="19" rx="4"/><path d="M17 21v-5a7 7 0 0 1 14 0v5"/><circle cx="24" cy="30" r="2.5" fill="#111" stroke="none"/></svg>
    <div style="flex:1;display:flex;flex-direction:column;gap:7px">
      <span style="font-size:13px;font-weight:600">集齐 8 件 · 解锁隐藏故事</span>
      <div class="bar" style="width:70%;height:8px"></div>
    </div>
    <span class="chip ghost">6/8</span>
  </div>

  <div class="tabbar">
    <div class="tab"><div class="ic"></div>首页</div>
    <div class="tab active"><div class="ic"></div>图鉴</div>
    <div class="tab"><div class="ic"></div>记录</div>
    <div class="tab"><div class="ic"></div>我的</div>
  </div>
</div>
<nav class="pager"><a href="05-chat.html">‹ 上一页</a><a href="index.html">总览</a><a href="07-history.html">下一页：浏览记录页 ›</a></nav>
</body>
</html>
