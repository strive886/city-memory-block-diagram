<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 定位页 · 城市记忆盲盒线框</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e9e9;color:#111;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:34px 16px 60px;min-height:100vh}
.page-tag{font-size:13px;color:#888;letter-spacing:2px;margin-bottom:14px}
.page-tag b{color:#111;font-size:15px}
.phone{width:390px;max-width:100%;background:#fff;border:2px solid #111;border-radius:28px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 12px 32px rgba(0,0,0,.10)}
.topbar{display:flex;align-items:center;gap:12px}
.back{width:34px;height:34px;flex:0 0 34px;border:1.5px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.title{font-size:17px;font-weight:700}
.spacer{flex:1}
.chip{border:1.5px solid #111;border-radius:999px;font-size:12px;padding:5px 12px;color:#111}
.chip.ghost{border-color:#9c9c9c;color:#777}
.box{border:1.5px solid #111;border-radius:14px}
.bar{height:10px;border-radius:5px;background:#dcdcdc}
.bar.d{background:#9c9c9c}
.btn{border:1.5px solid #111;border-radius:999px;padding:13px 0;text-align:center;font-size:15px;font-weight:600;background:#fff;color:#111}
.btn.solid{background:#111;color:#fff}
.ic{width:26px;height:26px;border:1.5px solid #111;border-radius:50%;flex:0 0 auto}
.divider{display:flex;align-items:center;gap:10px;color:#999;font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#ccc}
.pager{margin-top:18px;display:flex;gap:20px;font-size:13px}
.pager a{color:#555;text-decoration:none;border-bottom:1px solid #aaa;padding-bottom:2px}
.cityrow{border:1.5px solid #111;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:14.5px}
.radio{width:16px;height:16px;border:1.5px solid #111;border-radius:50%;flex:0 0 auto}
.radio.on{background:#111;box-shadow:inset 0 0 0 3px #fff}
</style>
</head>
<body>
<div class="page-tag"><b>02</b>&nbsp;定位页 · location.html</div>
<div class="phone">
  <div class="topbar"><div class="back">←</div><div class="title">城市定位</div><div class="spacer"></div><span class="chip ghost">GPS</span></div>
  <div style="display:flex;justify-content:center;padding:6px 0">
    <svg viewBox="0 0 200 170" width="200" height="170" fill="none" stroke="#111" stroke-width="2.5">
      <circle cx="100" cy="68" r="54" stroke="#bbb" stroke-dasharray="4 6"/>
      <circle cx="100" cy="68" r="32" stroke="#ccc" stroke-dasharray="3 5"/>
      <path d="M100 38c-14 0-24 10-24 23 0 17 24 39 24 39s24-22 24-39c0-13-10-23-24-23z"/>
      <circle cx="100" cy="61" r="7"/>
    </svg>
  </div>
  <div style="text-align:center;font-size:13.5px;color:#777">正在获取你的位置…</div>
  <div class="box" style="padding:18px;display:flex;align-items:center;gap:14px">
    <div class="ic" style="width:40px;height:40px"></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12px;color:#999">当前城市</span>
      <span style="font-size:21px;font-weight:700;letter-spacing:3px">石家庄</span>
    </div>
    <span class="chip">定位成功</span>
  </div>
  <div class="divider">或 · 手动切换城市</div>
  <div class="cityrow"><span class="radio on"></span>石家庄<div class="spacer"></div><span class="chip ghost">当前定位</span></div>
  <div class="cityrow"><span class="radio"></span>正定<div class="spacer"></div><span class="chip ghost">历史文化名城</span></div>
  <div class="btn solid">确认并进入首页</div>
</div>
<nav class="pager"><a href="01-login.html">‹ 上一页</a><a href="index.html">总览</a><a href="03-home.html">下一页：首页 ›</a></nav>
</body>
</html>
