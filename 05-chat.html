<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05 AI 故事与对话页 · 城市记忆盲盒线框</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e9e9;color:#111;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:34px 16px 60px;min-height:100vh}
.page-tag{font-size:13px;color:#888;letter-spacing:2px;margin-bottom:14px}
.page-tag b{color:#111;font-size:15px}
.phone{width:390px;max-width:100%;background:#fff;border:2px solid #111;border-radius:28px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 12px 32px rgba(0,0,0,.10)}
.topbar{display:flex;align-items:center;gap:12px}
.back{width:34px;height:34px;flex:0 0 34px;border:1.5px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.title{font-size:17px;font-weight:700}
.spacer{flex:1}
.chip{border:1.5px solid #111;border-radius:999px;font-size:12px;padding:5px 12px;color:#111}
.chip.ghost{border-color:#9c9c9c;color:#777}
.ph{border:1.5px dashed #9c9c9c;border-radius:12px;background:#fafafa;display:flex;align-items:center;justify-content:center;color:#8f8f8f;font-size:12px;position:relative;overflow:hidden;text-align:center}
.ph::before,.ph::after{content:"";position:absolute;inset:0}
.ph::before{background:linear-gradient(to top right,transparent calc(50% - .6px),#d6d6d6 calc(50% - .6px),#d6d6d6 calc(50% + .6px),transparent calc(50% + .6px))}
.ph::after{background:linear-gradient(to top left,transparent calc(50% - .6px),#d6d6d6 calc(50% - .6px),#d6d6d6 calc(50% + .6px),transparent calc(50% + .6px))}
.ph span{position:relative;z-index:1;padding:6px 10px}
.box{border:1.5px solid #111;border-radius:14px}
.bar{height:10px;border-radius:5px;background:#dcdcdc}
.bar.d{background:#9c9c9c}
.btn{border:1.5px solid #111;border-radius:999px;padding:13px 0;text-align:center;font-size:15px;font-weight:600;background:#fff;color:#111}
.btn.solid{background:#111;color:#fff}
.btn.ghost{border-color:#9c9c9c;color:#666;font-weight:400}
.ic{width:26px;height:26px;border:1.5px solid #111;border-radius:50%;flex:0 0 auto}
.ic.sm{width:20px;height:20px}
.divider{display:flex;align-items:center;gap:10px;color:#999;font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#ccc}
.pager{margin-top:18px;display:flex;gap:20px;font-size:13px}
.pager a{color:#555;text-decoration:none;border-bottom:1px solid #aaa;padding-bottom:2px}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{border:1.5px solid #111;border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:7px}
.bub.ai{border-radius:14px 14px 14px 4px;max-width:84%}
.bub.me{border-radius:14px 14px 4px 14px;align-self:flex-end;background:#f1f1f1;border-color:#8f8f8f;max-width:70%}
.inputrow{display:flex;gap:10px;align-items:center}
.field{flex:1;border:1.5px solid #111;border-radius:999px;padding:12px 16px;font-size:13px;color:#9a9a9a}
.send{border:1.5px solid #111;background:#111;color:#fff;border-radius:12px;padding:12px 15px;font-size:13px;font-weight:600}
.mic{width:40px;height:40px;border:1.5px solid #111;border-radius:50%;flex:0 0 auto}
.tri{width:0;height:0;border-left:8px solid #111;border-top:5px solid transparent;border-bottom:5px solid transparent;display:inline-block}
</style>
</head>
<body>
<div class="page-tag"><b>05</b>&nbsp;AI 故事与对话页 · chat.html</div>
<div class="phone">
  <div class="topbar"><div class="back">←</div><div class="title">AI 记忆讲述人</div><div class="spacer"></div><span class="chip ghost">TTS</span></div>

  <div style="display:flex;align-items:center;gap:12px">
    <div class="ph" style="width:62px;height:62px;flex:0 0 62px"><span>物件图</span></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:7px">
      <span style="font-size:15px;font-weight:700">旧车票 · 1987</span>
      <div class="bar" style="width:55%;height:8px"></div>
    </div>
    <span class="chip">石家庄</span>
  </div>

  <div class="box" style="padding:16px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center"><span class="chip ghost" style="font-size:11px">AI 生成 · 约80字</span><div class="spacer"></div><span style="font-size:11px;color:#bbb">知识库支撑 · 有据可查</span></div>
    <div class="bar"></div>
    <div class="bar" style="width:92%"></div>
    <div class="bar" style="width:96%"></div>
    <div class="bar" style="width:58%"></div>
    <div style="display:flex;align-items:center;gap:10px;border-top:1px dashed #ccc;padding-top:11px">
      <div class="ic sm"></div><span class="tri"></span><span style="font-size:12.5px;color:#555">播放语音</span><div class="spacer"></div><span style="font-size:11px;color:#bbb">00:24</span>
    </div>
  </div>

  <div class="divider">多轮对话</div>

  <div class="chat">
    <div class="bub ai"><div class="bar" style="width:95%"></div><div class="bar" style="width:70%"></div></div>
    <div class="bub me"><div class="bar d" style="width:60%"></div></div>
    <div class="bub ai"><div class="bar" style="width:90%"></div><div class="bar" style="width:85%"></div><div class="bar" style="width:45%"></div></div>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <span class="chip ghost">这件物件的来历？</span>
    <span class="chip ghost">换个角度讲讲</span>
    <span class="chip ghost">还有哪些老物件？</span>
  </div>

  <div class="inputrow">
    <div class="field">输入你的问题…</div>
    <div class="send">发送</div>
    <div class="mic"></div>
  </div>

  <div style="display:flex;gap:10px">
    <div class="btn ghost" style="flex:1">☆ 收藏到图鉴</div>
    <div class="btn solid" style="flex:1">生成纪念卡</div>
  </div>
</div>
<nav class="pager"><a href="04-grab.html">‹ 上一页</a><a href="index.html">总览</a><a href="06-collection.html">下一页：图鉴页 ›</a></nav>
</body>
</html>
